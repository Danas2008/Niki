# /etc/nginx/sites-available/niki.danielhavlicek.cz
# Cloudflare terminates the public TLS connection; this origin server can
# run plain HTTP (Cloudflare "Flexible") or HTTPS with an Origin CA cert
# (Cloudflare "Full (strict)", recommended). This config assumes plain
# HTTP on the origin — see the walkthrough for the Full (strict) variant.

server {
    listen 80;
    server_name niki.danielhavlicek.cz;

    client_max_body_size 20M;

    location /static/ {
        alias /home/niki/niki/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /home/niki/niki/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/niki.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
