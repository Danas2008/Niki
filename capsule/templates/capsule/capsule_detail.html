{% extends "base.html" %}
{% block title %}{{ capsule.title }}{% endblock %}
{% block content %}
<h1>{{ capsule.title }}</h1>
<div class="card">
    {{ capsule.body|linebreaks }}
</div>
<a class="btn" href="{% url 'capsule' %}">Zpět na kapsle</a>
{% endblock %}

{% block extra_scripts %}
{% if first_open %}
<script>document.addEventListener('DOMContentLoaded', () => fireConfetti());</script>
{% endif %}
{% endblock %}
