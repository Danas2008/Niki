# /etc/nginx/sites-available/niki.danielhavlicek.cz
# Cloudflare's zone-wide SSL/TLS mode is Full (strict), matching the rest
# of danielhavlicek.cz's subdomains — Cloudflare connects to this origin
# over HTTPS using the Cloudflare Origin CA certificate installed below.

server {
    listen 80;
    server_name niki.danielhavlicek.cz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name niki.danielhavlicek.cz;

    ssl_certificate     /etc/nginx/ssl/niki.danielhavlicek.cz.pem;
    ssl_certificate_key /etc/nginx/ssl/niki.danielhavlicek.cz.key;

    client_max_body_size 20M;

    location /static/ {
        alias /home/niki/niki/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /home/niki/niki/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/niki.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
